[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "robotlang"
version = "0.1.0"
description = "Compiler, optimizer, and virtual simulator for a robot-motion language"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.7"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
robotlang = "robotlang.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

